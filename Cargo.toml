
[workspace]
members = [
    "crates/crypto",
    "crates/core",
    "crates/network",
]

resolver ="3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
